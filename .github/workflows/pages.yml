name: Deploy to GitHub Pages

# Manual on purpose. Deploying from a workflow needs the Pages site to exist
# with "GitHub Actions" as its source, and that first setup cannot be automated:
# creating a Pages site through the API also requires repository administration
# rights, which the Actions GITHUB_TOKEN never has. Set the source once under
# Settings -> Pages, then run this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: configure
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Explain a missing Pages site
        if: steps.configure.outcome == 'failure'
        run: |
          echo "::error::No GitHub Pages site is configured for this repository."
          echo "::error::Open Settings -> Pages and set Source to 'GitHub Actions', then run this workflow again."
          echo "::error::Or set Source to 'Deploy from a branch' (main, / root) and skip this workflow entirely."
          exit 1

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js .nojekyll _site/
          cp -r styles src icons _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
