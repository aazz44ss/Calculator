<!DOCTYPE html>
<html lang="zh-Hant" data-theme="system" data-mode="standard">
  <head>
    <meta charset="utf-8" />
    <title>Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Windows 11 style calculator that installs to your home screen." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202020" media="(prefers-color-scheme: dark)" />

    <!-- iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Calculator" />
    <!-- Safari prefers this link over the manifest icons, so it has to exist. -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles/app.css" />
    <script>
      // Applied before first paint so the shell never flashes the wrong theme.
      try {
        const stored = localStorage.getItem('calculator:theme');
        if (stored === 'light' || stored === 'dark' || stored === 'system') {
          document.documentElement.dataset.theme = stored;
        }
      } catch {
        /* storage disabled */
      }
    </script>
  </head>
  <body>
    <div class="app" id="app">
      <div class="calculator" id="calculator">
        <header class="titlebar">
          <div class="titlebar-group">
            <button
              type="button"
              class="icon-button"
              id="mode-menu-button"
              aria-label="Switch calculator mode"
              aria-haspopup="menu"
              aria-controls="mode-menu"
              aria-expanded="false"
            >
              <span aria-hidden="true">☰</span>
            </button>
            <h1 class="titlebar-title" id="mode-title">Standard</h1>
          </div>

          <div class="mode-menu" id="mode-menu" role="menu" aria-label="Calculator mode" hidden>
            <button
              type="button"
              role="menuitemradio"
              class="mode-menu-item"
              data-mode-button="standard"
              aria-checked="true"
            >
              <span class="mode-menu-check" aria-hidden="true">✓</span>Standard
            </button>
            <button
              type="button"
              role="menuitemradio"
              class="mode-menu-item"
              data-mode-button="scientific"
              aria-checked="false"
            >
              <span class="mode-menu-check" aria-hidden="true">✓</span>Scientific
            </button>
            <button
              type="button"
              role="menuitemradio"
              class="mode-menu-item"
              data-mode-button="programmer"
              aria-checked="false"
            >
              <span class="mode-menu-check" aria-hidden="true">✓</span>Programmer
            </button>
          </div>
          <div class="titlebar-group">
            <button type="button" class="icon-button" id="theme-button" aria-label="Theme: system">
              <span aria-hidden="true" id="theme-icon">◐</span>
            </button>
            <button
              type="button"
              class="icon-button"
              id="history-button"
              aria-label="History"
              aria-expanded="false"
            >
              <span aria-hidden="true">🕘</span>
            </button>
          </div>
        </header>

        <div class="tape-area">
          <p class="install-hint" id="install-hint" hidden>
            <span class="install-hint-text" id="install-hint-text"></span>
            <button type="button" class="install-hint-dismiss" id="install-hint-dismiss">
              Got it
            </button>
          </p>
          <ol class="tape" id="tape" aria-label="Recent calculations"></ol>
        </div>

        <section class="display" id="display-area" aria-label="Display">
          <div class="display-badges">
            <span class="badge" id="paren-badge" hidden></span>
          </div>
          <div class="display-expression" id="expression" data-testid="expression"></div>
          <output class="display-value" id="display" aria-live="polite">0</output>
        </section>

        <div class="mode-strip">
          <div class="toolbar" id="toolbar" hidden></div>
          <ul class="base-list" id="base-list" aria-label="Number bases" hidden></ul>
        </div>

        <div class="keypad-area">
          <div class="keypad" id="keypad" role="group" aria-label="Keypad"></div>
        </div>
      </div>

      <aside class="side-panel" id="side-panel" data-open="false" aria-label="History">
        <div class="panel-tabs">
          <h2 class="panel-title">History</h2>
          <button
            type="button"
            class="icon-button panel-close"
            id="panel-close"
            aria-label="Close history"
          >
            <span aria-hidden="true">✕</span>
          </button>
        </div>
        <div class="panel-body">
          <ul class="panel-list" id="panel-history"></ul>
          <p class="panel-empty" id="panel-empty">There's no history yet.</p>
        </div>
        <div class="panel-footer">
          <button type="button" class="icon-button" id="panel-clear" aria-label="Clear list">
            <span aria-hidden="true">🗑</span>
          </button>
        </div>
      </aside>

      <div class="panel-backdrop" id="panel-backdrop" hidden></div>
    </div>

    <noscript>
      <p class="noscript">This calculator needs JavaScript enabled.</p>
    </noscript>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
